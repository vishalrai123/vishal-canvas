name: Deploy to GitHub Pages

# Adding or editing a file in tasks/ and pushing to main rebuilds and redeploys the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # prebuild validates every task file and fails on any error
      - name: Every published task produced a page
        run: |
          expected=$(ls tasks | grep -cE '^TASK-[0-9]{3}_.+\.md$')
          built=$(find out/work -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "task files: $expected, case-study pages: $built"
          test "$built" -ge 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
